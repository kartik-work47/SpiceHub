<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpiceHub — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/utils.js"></script>
  <script>Theme.init();</script>
</head>
<body>

  <div class="app">
    <!-- ===== Sidebar navigation (links built per role in app.js) ===== -->
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a href="#dashboard" class="brand">
        <span class="brand-logo" data-icon="logo" data-size="20"></span>
        <span class="brand-name">Spice<b>Hub</b></span>
      </a>
      <p class="nav-label">Menu</p>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-user" id="sideUser"></div>
    </aside>
    <div class="overlay" id="overlay"></div>

    <!-- ===== Main area ===== -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuToggle" aria-label="Open menu" data-icon="menu"></button>
        <div class="topbar-title">
          <h1 id="pageTitle">Dashboard</h1>
          <p id="pageSubtitle"></p>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="cartBtn" aria-label="Open cart" hidden>
            <span data-icon="cart"></span><span class="count-badge" id="cartCount"></span>
          </button>
          <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode"></button>
          <a href="#profile" class="avatar" id="topAvatar" title="My profile"></a>
        </div>
      </header>

      <!-- Each page (dashboard, menu, orders...) is rendered here -->
      <section class="view" id="view"></section>
    </main>
  </div>

  <!-- ===== Cart drawer ===== -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="cartDrawer" aria-label="Cart">
    <div class="drawer-head">
      <h3><span data-icon="cart"></span>Current Order</h3>
      <button class="icon-btn" id="closeDrawer" aria-label="Close cart" data-icon="x"></button>
    </div>
    <div class="drawer-body" id="cartBody"></div>
  </aside>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="js/icons.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
